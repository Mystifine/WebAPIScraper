<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Scraper Dashboard</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <header>
    <h1>Web Scraping Dashboard</h1>
  </header>

  <main>
    <form action="/scrape" method="POST">
      <label for="url">Enter URL to scrape:</label>
      <input type="url" id="url" name="url" placeholder="https://example.com" required>
      <button type="submit">Start Scraping</button>
    </form>

    {% if scraped_data %}
      <h2>Scraped Data:</h2>
      <table>
        <thead>
          <tr>
            {% for col in scraped_data[0].keys() %}
              <th>{{ col }}</th>
            {% endfor %}
          </tr>
        </thead>
        <tbody>
          {% for row in scraped_data %}
            <tr>
              {% for value in row.values() %}
                <td>{{ value }}</td>
              {% endfor %}
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% endif %}
  </main>

  <footer>
    <p>Web Scraping Project by [Your Name]</p>
  </footer>
</body>
</html>
